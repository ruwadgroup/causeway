name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Catch advisories that land between PRs.
    - cron: "27 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v7.1.1
        with:
          enable-cache: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: "3.13"
      - name: Install core + every extra into an audit venv
        # Local monorepo packages aren't published to PyPI, so pip-audit
        # can't resolve them and ``--strict`` rejects the whole run. Install
        # editable so ``--skip-editable`` filters them out while still leaving
        # every *transitive* dependency in the venv to be audited. The ``[all]``
        # extra pulls in every bundled contrib adapter's dependencies.
        run: |
          set -euo pipefail
          uv venv .venv-audit
          uv pip install --python .venv-audit/bin/python -e "./packages/causeway[all]"
          uv pip install --python .venv-audit/bin/python pip-audit
      - name: pip-audit (fails on any known vuln)
        run: .venv-audit/bin/pip-audit --skip-editable
