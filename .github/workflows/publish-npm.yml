name: Publish npm packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Which npm package to publish (or 'all' for all four)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - "@causewayjs/ts"
          - "@causewayjs/client"
          - "@causewayjs/react"
          - "@causewayjs/next"

permissions:
  contents: read

jobs:
  publish:
    name: Publish ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    strategy:
      fail-fast: false
      matrix:
        include:
          - { pkg: "@causewayjs/ts", dir: causeway-ts }
          - { pkg: "@causewayjs/client", dir: causeway-client }
          - { pkg: "@causewayjs/react", dir: causeway-react }
          - { pkg: "@causewayjs/next", dir: causeway-next }
        # The matrix above always includes all packages; the step-level `if` below
        # filters to the requested package when the input isn't `all`. (GitHub
        # Actions doesn't support a clean way to filter the matrix itself off
        # workflow_dispatch input.)
    steps:
      - if: inputs.package == 'all' || inputs.package == matrix.pkg
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6.0.0
      - if: inputs.package == 'all' || inputs.package == matrix.pkg
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.0
      - if: inputs.package == 'all' || inputs.package == matrix.pkg
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.0.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: inputs.package == 'all' || inputs.package == matrix.pkg
        run: pnpm install --frozen-lockfile
      - if: inputs.package == 'all' || inputs.package == matrix.pkg
        run: pnpm --filter "${{ matrix.pkg }}..." build
      - if: inputs.package == 'all' || inputs.package == matrix.pkg
        name: Publish ${{ matrix.pkg }} to npm
        working-directory: packages/${{ matrix.dir }}
        run: |
          set -euo pipefail
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION already published; skipping."
          else
            TAG=latest
            if [[ "$VERSION" == *-* ]]; then
              TAG="${VERSION#*-}"
              TAG="${TAG%%.*}"
            fi
            pnpm publish --provenance --access public --tag "$TAG" --no-git-checks
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
